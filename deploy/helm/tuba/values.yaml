nameOverride: ""
fullnameOverride: ""

image:
  registry: registry.example.invalid/tuba
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

common:
  organization: tenant_a
  namespace: tenant_a
  kafka:
    brokers: "kafka:9092"
    rawTopic: tuba.raw.events.v1
    quarantineTopic: tuba.quarantine.v1
    eventsTopic: tuba.events.authentication.v1
    analysisResultsTopic: tuba.analysis.results.v1
    attributedTopic: tuba.attributed.events.v1
    analysisResultsV2Topic: tuba.analysis.results.v2
    dlqTopic: tuba.indexing.dlq.v1
    securityProtocol: sasl_tls
    saslMechanism: scram-sha512
    tls:
      existingSecret: ""
      mountPath: /etc/tuba/kafka
      caFile: ca.crt
      certFile: tls.crt
      keyFile: tls.key
  elasticsearch:
    url: https://elasticsearch.example:9200
  otel:
    endpoint: http://otel-collector.observability.svc:4317

config:
  existingConfigMap: ""
  extraData: {}

secrets:
  existingSecret: tuba-runtime
  optional: false

vault:
  enabled: false
  secretProviderClassName: tuba-runtime
  secretName: tuba-vault-runtime
  mountPath: /mnt/vault
  vaultAddress: https://vault.example
  roleName: tuba
  objects:
    - key: ES_API_KEY
      objectName: tuba-es-api-key
    - key: DATABASE_URL
      objectName: tuba-database-url

gateway:
  enabled: false
  create: false
  name: tuba-gateway
  namespace: ""
  className: envoy-gateway
  hostname: tuba.example.com
  tlsSecretName: tuba-gateway-tls
  sectionName: https

networkPolicy:
  enabled: true
  dnsPort: 53
  kafkaPort: 9092
  postgresPort: 5432
  elasticsearchPort: 9200
  keycloakPort: 8443
  otelPort: 4317
  gatewayNamespaceSelector:
    kubernetes.io/metadata.name: envoy-gateway-system
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring

observability:
  serviceMonitor:
    enabled: false
    labels:
      release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    labels:
      release: kube-prometheus-stack
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    namespace: ""

backup:
  postgres:
    enabled: false
    schedule: "15 2 * * *"
    image: public.ecr.aws/docker/library/postgres:18.6-alpine
    existingSecret: tuba-backup
    existingClaim: tuba-postgres-backup
    mountPath: /backups
    retentionDays: 30
  elasticsearch:
    enabled: false
    schedule: "45 2 * * *"
    image: curlimages/curl:8.14.1
    existingSecret: tuba-backup
    repository: tuba-backups
    snapshotPrefix: tuba
    retentionCount: 30

services:
  ingest:
    enabled: true
    image: tuba-ingest
    replicas: 2
    appPort: 8080
    metricsPort: 8080
    service:
      enabled: true
      port: 8080
    probes:
      live: /health/live
      ready: /health/ready
    env:
      HTTP_LISTEN: ":8080"
      TUBA_ALLOW_NON_LOOPBACK_LISTEN: "true"
      INGEST_RATE_PER_SECOND: "2000"
      INGEST_RATE_BURST: "4000"
    resources:
      requests: {cpu: 200m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  analysisWorker:
    enabled: true
    image: tuba-analysis
    replicas: 2
    metricsPort: 9090
    service:
      enabled: false
    probes:
      live: /health/live
      ready: /health/ready
    env:
      METRICS_LISTEN: ":9090"
      TUBA_ALLOW_NON_LOOPBACK_LISTEN: "true"
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  analysisSink:
    enabled: true
    image: tuba-analysis-sink
    replicas: 2
    metricsPort: 19094
    service:
      enabled: false
    probes:
      live: /health/live
      ready: /health/ready
    env:
      ANALYSIS_SINK_METRICS_LISTEN: ":19094"
      TUBA_ALLOW_NON_LOOPBACK_LISTEN: "true"
    resources:
      requests: {cpu: 200m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  api:
    enabled: true
    image: tuba-api
    replicas: 2
    appPort: 8788
    metricsPort: 8788
    service:
      enabled: true
      port: 8788
    probes:
      live: /health/live
      ready: /health/ready
    env:
      API_LISTEN: ":8788"
      TUBA_ALLOW_NON_LOOPBACK_LISTEN: "true"
      OIDC_ISSUER: https://identity.example/realms/tuba
      OIDC_AUDIENCE: tuba-api
    resources:
      requests: {cpu: 200m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 65
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}

  web:
    enabled: true
    image: tuba-web
    replicas: 2
    appPort: 8080
    metricsPort: 0
    service:
      enabled: true
      port: 8080
    probes:
      live: /healthz
      ready: /healthz
    writablePaths:
      - /var/cache/nginx
      - /tmp
    env: {}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 75
    pdb:
      enabled: true
      minAvailable: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}
