{{- if .Values.vault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.vault.secretProviderClassName }}
  labels:
    {{- include "tuba.labels" . | nindent 4 }}
spec:
  provider: vault
  secretObjects:
    - secretName: {{ .Values.vault.secretName }}
      type: Opaque
      data:
        {{- range .Values.vault.objects }}
        - key: {{ .key }}
          objectName: {{ .objectName }}
        {{- end }}
  parameters:
    vaultAddress: {{ .Values.vault.vaultAddress | quote }}
    roleName: {{ .Values.vault.roleName | quote }}
    objects: |
      {{- range .Values.vault.objects }}
      - objectName: {{ .objectName | quote }}
        secretPath: {{ printf "secret/data/tuba/%s" .key | quote }}
        secretKey: value
      {{- end }}
{{- end }}
