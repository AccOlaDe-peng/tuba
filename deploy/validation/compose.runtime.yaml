# Alternate loopback ports for isolated runtime dependency/failure drills.
services:
  postgres:
    ports: !override
      - "127.0.0.1:15434:5432"
  kafka:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://127.0.0.1:19094,PLAINTEXT_INTERNAL://kafka:29092
    ports: !override
      - "127.0.0.1:19094:9092"
