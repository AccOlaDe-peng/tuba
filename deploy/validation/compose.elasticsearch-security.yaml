services:
  elasticsearch-security:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ES_VALIDATION_PASSWORD:?set ES_VALIDATION_PASSWORD to a temporary validation-only password}
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    ports:
      - "127.0.0.1:19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - elasticsearch-security-data:/usr/share/elasticsearch/data

volumes:
  elasticsearch-security-data:
