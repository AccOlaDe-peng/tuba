# Isolated runtime check for tuba-analysis-sink using its own ES API key.
# Use a unique Compose project name; all published ports are loopback only.
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18.6-alpine
    profiles: [api-identity]
    environment:
      POSTGRES_DB: tuba
      POSTGRES_USER: tuba
      POSTGRES_PASSWORD: ${DB_VALIDATION_PASSWORD:?set a temporary DB_VALIDATION_PASSWORD}
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - api-postgres-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:19095:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://127.0.0.1:19095,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 24

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in \
          tuba.raw.events.v1 tuba.quarantine.v1 tuba.indexing.dlq.v1 \
          tuba.analysis.results.v1 \
          tuba.events.authentication.v1 tuba.events.session.v1 \
          tuba.events.iam.v1 tuba.events.directory.v1 tuba.events.network.v1 \
          tuba.events.dns.v1 tuba.events.web.v1 tuba.events.tls.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$${topic}" --partitions 1 --replication-factor 1
        done
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ES_VALIDATION_PASSWORD:?set a temporary ES_VALIDATION_PASSWORD}
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    ports:
      - "127.0.0.1:19201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
    volumes:
      - analysis-sink-security-data:/usr/share/elasticsearch/data

volumes:
  analysis-sink-security-data:
  api-postgres-data:
