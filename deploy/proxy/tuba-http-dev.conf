# HTTP entry for the private development environment; include inside http {}.
server {
    listen 8088;
    server_name 10.6.68.248;
    client_max_body_size 1m;
    client_body_in_file_only off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / { return 302 /tuba/; }
    location = /tuba { return 302 /tuba/; }
    location = /tuba/config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'window.TUBA_CONFIG = {oidcIssuer:"/tuba-auth/realms/tuba",oidcClientId:"tuba-web",basePath:"/tuba"};';
    }
    location /tuba/ {
        alias /opt/tuba/web/dist/;
        try_files $uri $uri/ /tuba/index.html;
        index index.html;
    }
    location = /tuba-auth/realms/tuba/protocol/openid-connect/token {
        limit_except POST { deny all; }
        proxy_pass http://10.6.68.247:8180/realms/tuba/protocol/openid-connect/token;
        proxy_set_header Host 10.6.68.247:8180;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
    location = /health/ready { proxy_pass http://127.0.0.1:8788/health/ready; }
    location = /health/live { proxy_pass http://127.0.0.1:8788/health/live; }
    location / { return 404; }
}
