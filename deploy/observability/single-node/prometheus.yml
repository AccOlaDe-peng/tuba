global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: tuba-single-node-248

rule_files:
  - /opt/tuba/monitoring/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:19090]
  - job_name: tuba-capacity-guard
    static_configs:
      - targets: [127.0.0.1:19100]
  - job_name: node
    static_configs:
      - targets: [127.0.0.1:19101]
  - job_name: tuba-workers
    static_configs:
      - targets: [127.0.0.1:19095]
  - job_name: kafka-exporter
    static_configs:
      - targets: [127.0.0.1:19102]
