# Compose overlay for a PostgreSQL-backed Keycloak instance.
# Run together with ../../compose.yaml from the repository root.
services:
  keycloak-db-init:
    image: public.ecr.aws/docker/library/postgres:18.6-alpine
    profiles: ["identity-postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${KEYCLOAK_DB_ADMIN_USER:?set KEYCLOAK_DB_ADMIN_USER to a temporary PostgreSQL bootstrap role}
      PGPASSWORD: ${KEYCLOAK_DB_ADMIN_PASSWORD:?set KEYCLOAK_DB_ADMIN_PASSWORD in the protected environment file}
      TUBA_KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      TUBA_KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      TUBA_KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in the protected environment file}
    volumes:
      - ./deploy/keycloak/bootstrap-postgres.sh:/usr/local/bin/bootstrap-keycloak-db:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/bootstrap-keycloak-db"]
    restart: "no"

  keycloak:
    profiles: ["identity-postgres"]
    depends_on: !override
      postgres:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
    command: ["start", "--http-enabled=true", "--hostname-strict=false", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in the protected environment file}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in the protected environment file}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in the protected environment file}
    ports: !override
      - "127.0.0.1:${KEYCLOAK_POSTGRES_HOST_PORT:-8181}:8080"
    volumes: !override
      - ./deploy/keycloak/tuba-realm.json:/opt/keycloak/data/import/tuba-realm.json:ro
