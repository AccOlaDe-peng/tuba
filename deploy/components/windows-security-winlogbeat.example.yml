# Development profile: one Winlogbeat instance per Windows source/context.
# Start once with TUBA_WIN_INITIAL_CATCHUP=24h to bound the first read, wait
# until Kafka and TUBA have caught up, stop cleanly, then remove ignore_older
# for steady-state operation while preserving this instance's path.data.

winlogbeat.event_logs:
  - name: Security
    id: tuba-windows-security
    event_id: 4624,4625,4634,4647,4648,4672,4719,4720,4722,4723,4724,4725,4726,4728,4729,4732,4733,4756,4757,4768,4769,4771,4776,1102
    include_xml: true
    ignore_older: ${TUBA_WIN_INITIAL_CATCHUP:24h}
    tags: [tuba, windows-security]
    fields_under_root: true
    fields:
      event:
        dataset: windows.security
      tuba:
        source_context_id: ${TUBA_SOURCE_CONTEXT_ID}

processors:
  - add_fields:
      target: event
      fields:
        dataset: windows.security

  # Windows resolves task/opcode/keyword names, and renders the <RenderingInfo>
  # block, from the provider's message resources. Those strings are not stable
  # across reads of the same record: the same event rendered twice can carry
  # "Logon" one time and "Credential Validation" the next, which changes the
  # bytes the platform hashes for de-duplication and turns a re-read into a
  # rejection. The raw values are already inside event.original as <Task>,
  # <Opcode> and <Keywords>, so the derived copies are removed and the block
  # itself is stripped, leaving the system and event data the platform maps.
  - script:
      lang: javascript
      id: tuba_strip_rendering_info
      source: >-
        function process(event) {
          var original = event.Get("event.original");
          if (original === null || original === undefined) return;
          var start = original.indexOf("<RenderingInfo");
          if (start < 0) return;
          var end = original.indexOf("</RenderingInfo>");
          if (end < 0) return;
          event.Put("event.original", original.substring(0, start) + original.substring(end + 16));
        }

  # agent.ephemeral_id is minted per process start and event.created records the
  # moment the event was processed, so both change on every restart even though
  # the underlying record did not.
  - drop_fields:
      fields:
        - agent.ephemeral_id
        - event.created
        - event.action
        - winlog.task
        - winlog.opcode
        - winlog.keywords
      ignore_missing: true

queue.disk:
  path: ${path.data}/diskqueue
  max_size: 256MB
  segment_size: 16MB
  read_ahead: 512

winlogbeat.registry_file: ${path.data}/registry
# The default 5s flush interval means an abrupt stop loses up to five seconds of
# the event-log bookmark, and the next start re-reads those records. A re-read
# carries the same source position but not the same bytes, because Windows
# renders the localized task/opcode names inside event.original non-
# deterministically, so the re-read is rejected as a position conflict instead
# of being recognised as a duplicate. One second bounds how much can be re-read.
winlogbeat.registry_flush: 1s
setup.template.enabled: false
setup.ilm.enabled: false

output.kafka:
  enabled: true
  hosts: ["${TUBA_KAFKA_BROKERS}"]
  topic: "tuba.source.${TUBA_SOURCE_CONTEXT_ID}.v1"
  username: "${TUBA_KAFKA_USERNAME}"
  password: "${TUBA_KAFKA_PASSWORD}"
  sasl.mechanism: SCRAM-SHA-512
  security.protocol: SASL_PLAINTEXT
  version: "2.1.0"
  required_acks: -1
  compression: gzip
  max_message_bytes: 900000
  bulk_max_size: 128

logging.to_files: true
logging.files:
  path: ${path.data}/logs
  name: winlogbeat
  keepfiles: 4
  permissions: 0600

