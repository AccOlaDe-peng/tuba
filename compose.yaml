services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://127.0.0.1:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for spec in \
          tuba.raw.events.v1:1 \
          tuba.events.authentication.v1:1 \
          tuba.events.session.v1:1 \
          tuba.events.iam.v1:1 \
          tuba.events.directory.v1:1 \
          tuba.events.network.v1:1 \
          tuba.events.dns.v1:1 \
          tuba.events.web.v1:1 \
          tuba.events.tls.v1:1 \
          tuba.quarantine.v1:1 \
          tuba.attributed.events.v1:1 \
          tuba.analysis.results.v1:1 \
          tuba.indexing.dlq.v1:1; do
          topic="$${spec%%:*}"
          partitions="$${spec##*:}"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$${topic}" \
            --partitions "$${partitions}" --replication-factor 1
        done
    restart: "no"

  postgres:
    image: public.ecr.aws/docker/library/postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tuba}
      POSTGRES_USER: ${POSTGRES_USER:-tuba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tuba-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    depends_on:
      elasticsearch-backup-init:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      path.repo: /usr/share/elasticsearch/backups
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-backups:/usr/share/elasticsearch/backups

  elasticsearch-backup-init:
    image: busybox:1.37.0
    command: ["/bin/sh", "-ec", "mkdir -p /backups && chown -R 1000:0 /backups"]
    volumes:
      - elasticsearch-backups:/backups

  keycloak-data-init:
    image: busybox:1.37.0
    command: ["/bin/sh", "-ec", "mkdir -p /data && chown -R 1000:0 /data"]
    volumes:
      - keycloak-data:/data
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    profiles: ["identity"]
    depends_on:
      keycloak-data-init:
        condition: service_completed_successfully
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-only}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./deploy/keycloak/local-dev:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data/h2
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  kafka-data:
  postgres-data:
  elasticsearch-data:
  elasticsearch-backups:
  keycloak-data:
