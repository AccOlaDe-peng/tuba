[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuba-analysis"
version = "0.1.0"
requires-python = "==3.14.*"
description = "Python analysis workers for the TUBA Go and Kafka product"
dependencies = [
  "confluent-kafka==2.15.1",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "psycopg[binary]>=3.3.6",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
]

[project.scripts]
tuba-analysis-worker = "tuba_analysis.worker:main"
tuba-analysis-replay = "tuba_analysis.replay:main"
tuba-analysis-evaluate = "tuba_analysis.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tuba_analysis*"]

[tool.setuptools.package-data]
tuba_analysis = ["registry/*.json"]
